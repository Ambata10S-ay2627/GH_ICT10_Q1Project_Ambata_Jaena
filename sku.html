<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://pyscript.net/releases/2026.7.3/core.css" />
    <script type="module" src="https://pyscript.net/releases/2026.7.3/core.js"></script>
    <title>SKU Generator</title>

    <!-- BOOTSTRAP -->    
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <title></title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

        <nav class="navbar navbar-expand-sm navbar-dark bg-dark">
          <div class="container-fluid">
                    <a class="navbar-brand">Tapioca Corner Cafe</a>
               </div>

               <li><a href="sku.html" style="color: white;">𝄃𝄂𝄀 SKU Generator</a></li>
               <li><a href="index.html" style="color: white;">🛈 Receipt Generator</a></li>
        </nav>

    <div id="stock">

        <div id="cover">
        <h2>𝄃𝄂𝄀</h2>
        <h4>SKU Generator</h4>
        </div>


    <label for="ctg">𖤘 Category:</label><br>
    <br>
    <select name="category" class="form-control">
        <option>Perishables</option>
        <option>Non-Perishables</option>
        <option>High Sugar Level</option>
        <option>Medium Sugar Level</option>
        <option>Low Sugar Level</option>
    </select><br>


    <label for="prods">𖠩 Product Name:</label><br>
    <br>
    <select name="prods" class="form-control">
        <option>Regular Milktea</option>
        <option>Brown Sugar Milktea</option>
        <option>Sweet Taro Milktea</option>
        <option>Cookies & Cream Cheesecake Milktea</option>
    </select>


    <label for="qnty">% Stock Quantity:</label><br>
    <br>
    <select name="qnty" class="form-control">
        <option>20</option>
        <option>40</option>
        <option>60</option>
        <option>67</option>
    </select>

    <br>

    <button type="button" py-click="generate_sku">Generate SKU</button><br>

    <hr>

    <h3>====Generated Sku====</h3>
    <div id="present"></div>





    <footer class="text-center py-3 bg-dark text-light mt-auto fixed-bottom">
	SKU Generator -- 1st Quarter Project
    </footer>
    <py-script src="main.py"></py-script>
    
</body>
</html>
